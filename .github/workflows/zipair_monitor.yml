name: ZipAir Flight Monitor

on:
  schedule:
    # Run every hour
    # - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ZipAir
        run: npm install

      - name: Install Playwright browsers
        working-directory: ZipAir
        run: npx playwright install --with-deps chromium

      - name: Run monitoring script
        working-directory: ZipAir
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: npm run dev

      - name: Commit and push state update
        if: always()
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Force add the state file even if it's untracked
          git add ZipAir/data/last_check.json || true
          
          # Check if there are any staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ZipAir monitor state [skip ci]"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: echo "❌ ZipAir Monitoring workflow failed. Check logs for details."
