name: Relocation Specials Monitor

on:
  schedule:
    # Run every hour (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: CampingCar
        run: npm ci

      - name: Install Playwright browsers
        working-directory: CampingCar
        run: npx playwright install --with-deps

      - name: Run monitoring script
        working-directory: CampingCar
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: npm run dev

      - name: Commit and push state update
        if: always()
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Check if there are any changes
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add CampingCar/data/last_check.json
            git commit -m "chore: update relocation specials state [skip ci]"
            git push
          fi

      - name: Notify on failure
        if: failure()
        run: echo "❌ Monitoring workflow failed. Check logs for details."
